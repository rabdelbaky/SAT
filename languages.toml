# languages.toml — the rulebook for Pre-LLM Checks.
# Adding a language = adding an entry here, not changing code.
# tested = false until all applicable fixtures pass (see CONTEXT.md).

[language.python]
extensions        = [".py"]
build_files       = ["pyproject.toml", "requirements.txt"]
build_priority    = ["pyproject.toml", "requirements.txt"]
dep_folders       = []
dep_error_phrases = ["ModuleNotFoundError", "No module named"]
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["coverage.xml", ".coverage"]
tested            = false

# stage_names: script name fragments that map to each stage.
# Keys are stage names; values are lists of accepted prefixes/exact names.
[language.python.stage_names]
build    = ["build"]
lint     = ["lint", "check", "flake8", "ruff", "mypy", "pylint"]
tests    = ["test", "tests", "pytest"]
coverage = ["coverage", "cov"]

# config_files: presence of any of these files next to the build file means
# the tool is configured (even if no script is defined).
# Keys are stage names; values are lists of config file patterns.
[language.python.config_files]
lint     = ["pyproject.toml", ".flake8", "setup.cfg", ".pylintrc",
            "ruff.toml", ".ruff.toml"]
tests    = ["pytest.ini", "pyproject.toml", "setup.cfg", "tox.ini"]
coverage = [".coveragerc", "pyproject.toml", "setup.cfg"]

# builtin_phases: commands that are always available for the build system,
# require no script, no config, just the build tool.
[language.python.builtin_phases]
build    = []
lint     = []
tests    = []
coverage = []

# config_commands: the tool is run only when the project itself declares it,
# either as a config file next to the build file ("files") or as a table in
# pyproject.toml ("pyproject_tables").  A dev-dependency alone never counts.
# Python has no build stage command (build = n/a).
[[language.python.config_commands]]
stage            = "tests"
files            = ["pytest.ini"]
pyproject_tables = ["tool.pytest"]
command          = "pytest"

[[language.python.config_commands]]
stage            = "lint"
files            = ["ruff.toml", ".ruff.toml"]
pyproject_tables = ["tool.ruff"]
command          = "ruff check ."

[[language.python.config_commands]]
stage            = "lint"
files            = [".flake8"]
command          = "flake8 ."

[[language.python.config_commands]]
stage            = "lint"
files            = [".pylintrc"]
pyproject_tables = ["tool.pylint"]
command          = "pylint --recursive=y ."

[[language.python.config_commands]]
stage            = "lint"
files            = ["mypy.ini"]
pyproject_tables = ["tool.mypy"]
command          = "mypy ."

[[language.python.config_commands]]
stage            = "coverage"
files            = [".coveragerc"]
pyproject_tables = ["tool.coverage"]
command          = "pytest --cov --cov-report=xml"


[language.javascript]
# Covers both JS and TypeScript projects (keyed as "javascript").
extensions        = [".js", ".ts", ".jsx", ".tsx", ".mjs", ".cjs"]
build_files       = ["package.json"]
build_priority    = ["package.json"]
dep_folders       = ["node_modules"]
# "npm ERR!" is deliberately absent: npm <= 10 prints it for ANY failing script,
# which would turn a real test/lint failure into dependencies_missing.
dep_error_phrases = ["Cannot find module", "MODULE_NOT_FOUND", "command not found",
                     "is not recognized as an internal or external command"]
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["coverage/coverage-summary.json", "coverage/lcov.info"]
tested            = false

[language.javascript.stage_names]
build    = ["build", "compile", "tsc"]
lint     = ["lint", "check", "eslint", "tslint", "biome", "oxlint"]
tests    = ["test", "tests", "jest", "vitest", "mocha", "jasmine"]
coverage = ["coverage", "cov"]

[language.javascript.config_files]
lint     = [".eslintrc", ".eslintrc.js", ".eslintrc.cjs", ".eslintrc.json",
            ".eslintrc.yaml", ".eslintrc.yml", "eslint.config.js",
            "eslint.config.mjs", "eslint.config.cjs",
            ".biome.json", "biome.json",
            "oxlint.json", ".oxlintrc"]
tests    = ["jest.config.js", "jest.config.ts", "jest.config.mjs",
            "jest.config.cjs", "jest.config.json",
            "vitest.config.js", "vitest.config.ts", "vitest.config.mjs",
            ".mocharc.js", ".mocharc.yaml", ".mocharc.yml", ".mocharc.json"]
coverage = ["jest.config.js", "jest.config.ts", "jest.config.mjs",
            "jest.config.cjs", "jest.config.json",
            "vitest.config.js", "vitest.config.ts", "vitest.config.mjs",
            ".nycrc", ".nycrc.json", "nyc.config.js"]

[language.javascript.builtin_phases]
build    = []
lint     = []
tests    = []
coverage = []


# config_commands: run only when the project declares the tool with a config file
# next to package.json.  Run through `npx --no-install` so nothing is downloaded.
[[language.javascript.config_commands]]
stage   = "build"
files   = ["tsconfig.json"]
command = "npx --no-install tsc --noEmit"

[[language.javascript.config_commands]]
stage   = "lint"
files   = [".eslintrc", ".eslintrc.js", ".eslintrc.cjs", ".eslintrc.json",
           ".eslintrc.yaml", ".eslintrc.yml", "eslint.config.js",
           "eslint.config.mjs", "eslint.config.cjs"]
command = "npx --no-install eslint ."

[[language.javascript.config_commands]]
stage   = "lint"
files   = ["biome.json", ".biome.json"]
command = "npx --no-install biome check ."

[[language.javascript.config_commands]]
stage   = "tests"
files   = ["jest.config.js", "jest.config.ts", "jest.config.mjs",
           "jest.config.cjs", "jest.config.json"]
command = "npx --no-install jest"

[[language.javascript.config_commands]]
stage   = "tests"
files   = ["vitest.config.js", "vitest.config.ts", "vitest.config.mjs"]
command = "npx --no-install vitest run"

[[language.javascript.config_commands]]
stage   = "tests"
files   = [".mocharc.js", ".mocharc.yaml", ".mocharc.yml", ".mocharc.json"]
command = "npx --no-install mocha"

[[language.javascript.config_commands]]
stage   = "coverage"
files   = ["jest.config.js", "jest.config.ts", "jest.config.mjs",
           "jest.config.cjs", "jest.config.json"]
command = "npx --no-install jest --coverage --coverageReporters=json-summary"

[language.java]
extensions        = [".java"]
build_files       = ["pom.xml", "build.gradle", "build.gradle.kts"]
build_priority    = ["pom.xml", "build.gradle", "build.gradle.kts"]
dep_folders       = []
# "BUILD FAILURE" is deliberately absent: Maven prints it for ANY failed build.
dep_error_phrases = ["Could not resolve", "Could not find artifact", "Non-resolvable parent POM"]
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["target/site/jacoco/jacoco.xml"]
tested            = false

[language.java.stage_names]
build    = ["build", "compile", "package", "install"]
lint     = ["lint", "check", "checkstyle", "pmd", "spotbugs", "verify"]
tests    = ["test", "tests"]
coverage = ["coverage", "jacoco"]

[language.java.config_files]
lint     = ["checkstyle.xml", ".checkstyle", "pmd.xml", "spotbugs.xml"]
tests    = []
coverage = ["jacoco.xml"]

# build_tools: which command prefixes belong to which build file.  A pom.xml
# project only gets mvn/mvnw commands, a Gradle project only gradle/gradlew.
[language.java.build_tools]
"pom.xml"          = ["mvn", "./mvnw"]
"build.gradle"     = ["gradle", "./gradlew"]
"build.gradle.kts" = ["gradle", "./gradlew"]

# Maven and Gradle have built-in lifecycle phases for build and tests only.
# Lint and coverage are NOT built-in: they run only when the build file
# declares the plugin (see config_commands below), so a bare project reports
# no_linter_configured instead of failing on a plugin it never declared.
[language.java.builtin_phases]
build    = ["mvn compile", "mvn package", "mvn install",
            "gradle build", "gradle assemble",
            "./mvnw compile", "./mvnw package", "./mvnw install",
            "./gradlew build", "./gradlew assemble"]
lint     = []
tests    = ["mvn test", "./mvnw test",
            "gradle test", "./gradlew test"]
coverage = []

# config_commands: the tool runs when the build file declares its plugin
# (build_file_contains) or a lint config file sits next to it (files).
# Maven rules apply to pom.xml only, Gradle rules to the Gradle build files.
[[language.java.config_commands]]
stage               = "lint"
build_files         = ["pom.xml"]
build_file_contains = ["maven-checkstyle-plugin"]
files               = ["checkstyle.xml", ".checkstyle"]
command             = "mvn checkstyle:check"

[[language.java.config_commands]]
stage               = "lint"
build_files         = ["pom.xml"]
build_file_contains = ["maven-pmd-plugin"]
files               = ["pmd.xml"]
command             = "mvn pmd:check"

[[language.java.config_commands]]
stage               = "lint"
build_files         = ["pom.xml"]
build_file_contains = ["spotbugs-maven-plugin"]
files               = ["spotbugs.xml"]
command             = "mvn spotbugs:check"

[[language.java.config_commands]]
stage               = "coverage"
build_files         = ["pom.xml"]
build_file_contains = ["jacoco-maven-plugin"]
command             = "mvn jacoco:report"

[[language.java.config_commands]]
stage               = "lint"
build_files         = ["build.gradle", "build.gradle.kts"]
build_file_contains = ["checkstyle"]
command             = "gradle checkstyleMain"

[[language.java.config_commands]]
stage               = "lint"
build_files         = ["build.gradle", "build.gradle.kts"]
build_file_contains = ["pmd"]
command             = "gradle pmdMain"

[[language.java.config_commands]]
stage               = "lint"
build_files         = ["build.gradle", "build.gradle.kts"]
build_file_contains = ["spotbugs"]
command             = "gradle spotbugsMain"

[[language.java.config_commands]]
stage               = "coverage"
build_files         = ["build.gradle", "build.gradle.kts"]
build_file_contains = ["jacoco"]
command             = "gradle jacocoTestReport"


[language.kotlin]
extensions        = [".kt", ".kts"]
build_files       = ["build.gradle", "build.gradle.kts"]
build_priority    = ["build.gradle.kts", "build.gradle"]
dep_folders       = []
# "BUILD FAILURE" is deliberately absent: Maven prints it for ANY failed build.
dep_error_phrases = ["Could not resolve", "Could not find artifact", "Non-resolvable parent POM"]
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["build/reports/jacoco/test/jacocoTestReport.xml"]
tested            = false

[language.kotlin.stage_names]
build    = ["build", "compile", "assemble"]
lint     = ["lint", "check", "detekt", "ktlint"]
tests    = ["test", "tests"]
coverage = ["coverage", "jacoco"]

[language.kotlin.config_files]
lint     = ["detekt.yml", "detekt.yaml", ".detekt.yml", ".ktlint"]
tests    = []
coverage = []

# build_tools: Kotlin builds with Gradle only.
[language.kotlin.build_tools]
"build.gradle"     = ["gradle", "./gradlew"]
"build.gradle.kts" = ["gradle", "./gradlew"]

# Build and tests are built-in Gradle tasks.  Lint and coverage are NOT
# built-in (`gradle check` also runs tests, and detekt/ktlint/jacoco may not be
# declared): they come from config_commands, only when the project declares them.
[language.kotlin.builtin_phases]
build    = ["gradle build", "gradle assemble",
            "./gradlew build", "./gradlew assemble"]
lint     = []
tests    = ["gradle test", "./gradlew test"]
coverage = []

[[language.kotlin.config_commands]]
stage               = "lint"
build_file_contains = ["detekt"]
files               = ["detekt.yml", "detekt.yaml", ".detekt.yml"]
command             = "gradle detekt"

[[language.kotlin.config_commands]]
stage               = "lint"
build_file_contains = ["ktlint"]
files               = [".ktlint"]
command             = "gradle ktlintCheck"

[[language.kotlin.config_commands]]
stage               = "coverage"
build_file_contains = ["jacoco"]
command             = "gradle jacocoTestReport"


[language.go]
extensions        = [".go"]
build_files       = ["go.mod"]
build_priority    = ["go.mod"]
dep_folders       = []
dep_error_phrases = ["cannot find module", "no required module"]
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["coverage.out"]
tested            = false

[language.go.stage_names]
build    = ["build"]
lint     = ["lint", "vet", "check"]
tests    = ["test", "tests"]
coverage = ["coverage", "cov"]

[language.go.config_files]
lint     = [".golangci.yml", ".golangci.yaml", ".golangci.json", ".golangci.toml",
            "golangci.yml", "golangci.yaml"]
tests    = []
coverage = []

[language.go.builtin_phases]
build    = ["go build ./..."]
lint     = ["go vet ./..."]
tests    = ["go test ./..."]
coverage = ["go test -coverprofile=coverage.out ./..."]

# go vet ships with the Go toolchain, so every Go module has a linter (no_linter_configured
# does not apply).  A golangci-lint config declared by the project replaces it.
[[language.go.config_commands]]
stage   = "lint"
files   = [".golangci.yml", ".golangci.yaml", ".golangci.json", ".golangci.toml",
           "golangci.yml", "golangci.yaml"]
command = "golangci-lint run"


[language.csharp]
# C#/.NET — keyed as "csharp".
extensions        = [".cs"]
build_files       = ["*.sln", "*.csproj"]
build_priority    = ["*.sln", "*.csproj"]
dep_folders       = []
dep_error_phrases = ["error NU", "Unable to find package"]
stages            = ["build", "lint", "tests", "coverage"]
# `dotnet test` writes TestResults/<guid>/coverage.cobertura.xml (in the test project folder).
coverage_files    = ["**/TestResults/*/coverage.cobertura.xml"]
tested            = false

[language.csharp.stage_names]
build    = ["build", "compile", "publish"]
lint     = ["lint", "check", "format", "analyze"]
tests    = ["test", "tests"]
coverage = ["coverage", "cov"]

[language.csharp.config_files]
lint     = [".editorconfig", ".stylecop", "StyleCop.Analyzers.json"]
tests    = []
coverage = ["coverlet.runsettings", "*.runsettings"]

# `dotnet format --verify-no-changes` is read-only and ships with the SDK, so every
# .NET project has a linter.  Coverage is not built-in: the collector only works when the
# test project references coverlet.collector (see config_commands).
[language.csharp.builtin_phases]
build    = ["dotnet build", "msbuild"]
lint     = ["dotnet format --verify-no-changes"]
tests    = ["dotnet test"]
coverage = []

[[language.csharp.config_commands]]
stage               = "coverage"
build_file_contains = ["coverlet.collector"]
files               = ["coverlet.runsettings", "*.runsettings"]
command             = 'dotnet test --collect:"XPlat Code Coverage"'


[language.rust]
extensions        = [".rs"]
build_files       = ["Cargo.toml"]
build_priority    = ["Cargo.toml"]
dep_folders       = []
# Only genuinely-missing-dependency messages: "could not compile" / "error[E" appear for ANY
# rustc error and would turn real build failures into dependencies_missing.
dep_error_phrases = ["no matching package", "failed to select a version", "failed to download",
                     "failed to get `"]
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["cobertura.xml", "lcov.info"]
tested            = false

[language.rust.stage_names]
build    = ["build"]
lint     = ["lint", "check", "clippy", "fmt"]
tests    = ["test", "tests"]
coverage = ["coverage", "cov", "tarpaulin", "llvm-cov"]

[language.rust.config_files]
lint     = [".clippy.toml", "clippy.toml"]
tests    = []
coverage = ["tarpaulin.toml"]

# cargo build / clippy / test ship with the toolchain.  Coverage does not: `cargo tarpaulin`
# is a separate install, so it runs only when the project declares it (config_commands).
[language.rust.builtin_phases]
build    = ["cargo build", "cargo build --release"]
lint     = ["cargo clippy", "cargo clippy -- -D warnings",
            "cargo fmt --check", "cargo fmt -- --check"]
tests    = ["cargo test"]
coverage = []

[[language.rust.config_commands]]
stage               = "coverage"
files               = ["tarpaulin.toml", ".tarpaulin.toml"]
build_file_contains = ["[package.metadata.tarpaulin"]
command             = "cargo tarpaulin --out Xml"


[language.php]
extensions        = [".php"]
build_files       = ["composer.json"]
build_priority    = ["composer.json"]
dep_folders       = ["vendor"]
# "No such file or directory" is deliberately absent: PHP prints it for any failed include/fopen in
# the project's own code.  vendor/autoload.php missing means `composer install` was never run.
dep_error_phrases = ["vendor/autoload.php", "Your requirements could not be resolved",
                     "Composer could not find"]
stages            = ["lint", "tests", "coverage"]
coverage_files    = ["coverage.xml", "clover.xml"]
tested            = false

[language.php.stage_names]
build    = []
lint     = ["lint", "check", "phpcs", "phpstan", "psalm", "phan"]
tests    = ["test", "tests", "phpunit"]
coverage = ["coverage", "cov"]

[language.php.config_files]
lint     = ["phpcs.xml", "phpcs.xml.dist", ".phpcs.xml",
            "phpstan.neon", "phpstan.neon.dist",
            "psalm.xml", "psalm.xml.dist",
            ".php-cs-fixer.php", ".php-cs-fixer.dist.php"]
tests    = ["phpunit.xml", "phpunit.xml.dist"]
coverage = ["phpunit.xml", "phpunit.xml.dist"]

[language.php.builtin_phases]
build    = []
lint     = []
tests    = []
coverage = []

# config_commands: tools are project-local (vendor/bin/...) and run only when the project declares
# them with a config file next to composer.json (or a composer script, which always wins).
# Coverage needs a driver (Xdebug/PCOV); without one phpunit warns and writes nothing, which
# surfaces as coverage_missing.
[[language.php.config_commands]]
stage   = "tests"
files   = ["phpunit.xml", "phpunit.xml.dist"]
command = "vendor/bin/phpunit"

[[language.php.config_commands]]
stage   = "lint"
files   = ["phpcs.xml", "phpcs.xml.dist", ".phpcs.xml"]
command = "vendor/bin/phpcs"

[[language.php.config_commands]]
stage   = "lint"
files   = ["phpstan.neon", "phpstan.neon.dist"]
command = "vendor/bin/phpstan analyse"

[[language.php.config_commands]]
stage   = "lint"
files   = ["psalm.xml", "psalm.xml.dist"]
command = "vendor/bin/psalm"

# php-cs-fixer rewrites files by default; only the read-only form is ever run.
[[language.php.config_commands]]
stage   = "lint"
files   = [".php-cs-fixer.php", ".php-cs-fixer.dist.php"]
command = "vendor/bin/php-cs-fixer fix --dry-run --diff"

[[language.php.config_commands]]
stage   = "coverage"
files   = ["phpunit.xml", "phpunit.xml.dist"]
command = "vendor/bin/phpunit --coverage-clover clover.xml"


[language.ruby]
extensions        = [".rb"]
build_files       = ["Gemfile"]
build_priority    = ["Gemfile"]
dep_folders       = ["vendor/bundle"]
dep_error_phrases = ["cannot load such file", "LoadError"]
stages            = ["lint", "tests", "coverage"]
coverage_files    = ["coverage/.resultset.json"]
tested            = false

[language.ruby.stage_names]
build    = []
lint     = ["lint", "check", "rubocop", "standardrb"]
tests    = ["test", "tests", "rspec", "minitest"]
coverage = ["coverage", "cov"]

[language.ruby.config_files]
lint     = [".rubocop.yml", ".rubocop.yaml",
            ".standard.yml"]
tests    = [".rspec", "spec_helper.rb"]
coverage = [".simplecov"]

[language.ruby.builtin_phases]
build    = []
lint     = []
tests    = []
coverage = []


[language.swift]
extensions        = [".swift"]
build_files       = ["Package.swift", "*.xcodeproj"]
build_priority    = ["Package.swift", "*.xcodeproj"]
dep_folders       = []
dep_error_phrases = ["error: no such module", "missing package"]
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["*.lcov", "lcov.info"]
tested            = false

[language.swift.stage_names]
build    = ["build"]
lint     = ["lint", "check", "swiftlint", "swiftformat"]
tests    = ["test", "tests"]
coverage = ["coverage", "cov"]

[language.swift.config_files]
lint     = [".swiftlint.yml", ".swiftlint.yaml",
            ".swiftformat", "swiftformat.yml"]
tests    = []
coverage = []

[language.swift.builtin_phases]
build    = ["swift build"]
lint     = []
tests    = ["swift test"]
coverage = []


[language.cpp]
# C and C++ — keyed as "cpp".
extensions        = [".c", ".cpp", ".cc", ".cxx", ".h", ".hpp"]
build_files       = ["CMakeLists.txt", "Makefile", "meson.build"]
build_priority    = ["CMakeLists.txt", "Makefile", "meson.build"]
dep_folders       = []
dep_error_phrases = ["fatal error:", "No such file or directory"]
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["lcov.info", "coverage.xml"]
tested            = false

[language.cpp.stage_names]
build    = ["build", "compile", "all"]
lint     = ["lint", "check", "clang-tidy", "cppcheck", "clang-format"]
tests    = ["test", "tests", "ctest"]
coverage = ["coverage", "cov"]

[language.cpp.config_files]
lint     = [".clang-tidy", ".clang-format", "CppCheckSuppressions.txt"]
tests    = ["CTestTestfile.cmake"]
coverage = []

[language.cpp.builtin_phases]
build    = ["cmake --build .", "make", "ninja"]
lint     = []
tests    = ["ctest --output-on-failure"]
coverage = []
