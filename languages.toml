[language.cpp]
# C and C++ — keyed as "cpp".
extensions        = [".c", ".cpp", ".cc", ".cxx", ".h", ".hpp"]
build_files       = ["CMakeLists.txt", "Makefile", "meson.build"]
build_priority    = ["CMakeLists.txt", "Makefile", "meson.build"]
dep_folders       = []
dep_error_phrases = []
stages            = ["build", "lint", "tests", "coverage"]
coverage_files    = ["lcov.info", "coverage.xml"]
tested            = false

[language.cpp.stage_names]
